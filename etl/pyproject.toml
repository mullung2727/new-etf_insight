[project]
name = "new-etf-insight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "google-genai>=1.0.0",
    "langgraph>=1.2.0",
    "pandas>=2.0.0",
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.1",
    "yt-dlp>=2024.1.0",
    "youtube-transcript-api>=1.2.0,<2",
    "holidays>=0.100",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/new_etf_insight"]

[project]
name = "new-etf-insight"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=6.11.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/new_etf_insight"]
